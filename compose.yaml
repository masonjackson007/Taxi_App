version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/Taxi_App/data

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend

  test:
    build: .
    command: |
      bash -c "pytest backend/tests"
    volumes:
      - ./backend:/Taxi_App/backend
      - ./frontend:/Taxi_App/frontend
    depends_on:
      - backend
      - frontend
