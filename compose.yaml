version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/Taxi_App/data

  backend_test:
    build: ./backend
    volumes:
      - ./data:/Taxi_App/data
    command: pytest tests/ -v

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:5000/api
    depends_on:
      - backend